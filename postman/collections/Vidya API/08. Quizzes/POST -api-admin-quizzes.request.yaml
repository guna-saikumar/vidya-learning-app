$kind: http-request
name: POST /api/admin/quizzes
description: Create quiz
url: "{{baseUrl}}/api/admin/quizzes"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Demo Quiz",
      "chapterId": "c8-m-ch1",
      "timeLimitMinutes": 10,
      "questions": [
        {
          "question": "2 + 2 = ?",
          "options": ["3", "4", "5", "6"],
          "correctIndex": 1,
          "explanation": "Basic arithmetic"
        }
      ]
    }
order: 9400
