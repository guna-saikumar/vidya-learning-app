$kind: collection
description: |-
  # Vidya API

  Production: `https://vidya-api-kohl.vercel.app`
  Local: `http://localhost:4000`

  ## Setup
  1. Set collection vars `adminPassword` / `studentPassword` (seed / static admin) — **do not commit secrets**.
  2. Run **Admin Auth → login** (static) or **Student login** — tokens auto-save.
  3. Admin folders are GET-only (static fixtures). Student routes hit Postgres.
  4. After editing YAML, run `npm run postman:export` to refresh `postman/Vidya-API.postman_collection.json`.

  ## Docs
  - Swagger UI: `{{baseUrl}}/docs`
  - OpenAPI JSON: `{{baseUrl}}/docs-json`
