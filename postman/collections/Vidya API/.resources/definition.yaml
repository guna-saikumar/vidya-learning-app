$kind: collection
description: |-
  # Vidya API (student)

  Local: `http://localhost:4000` or your LAN IP from `npm start`
  Same Wi‑Fi teammates: use the printed LAN API URL.

  ## Setup
  1. Set `studentPassword` from seed (`StudentDemo1!`) — **do not commit secrets**.
  2. Run **Student Auth → login** — token auto-saves.
  3. Student domains: Health, Auth, Curriculum, Materials, Dashboard, Learning, Quizzes, Tasks, Notifications, Exams.
  4. After editing YAML, run `npm run postman:export`.

  ## Docs
  - Swagger UI: `{{baseUrl}}/docs`
  - OpenAPI JSON: `{{baseUrl}}/docs-json`
variables:
  baseUrl: http://localhost:4000
  studentEmail: student@vidya.test
  studentPassword: ""
  studentToken: ""
  studentUserId: ""
  bookmarkId: ""
