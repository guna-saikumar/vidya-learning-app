$kind: http-request
name: POST /api/admin/exams/results
description: Publish exam result
url: "{{baseUrl}}/api/admin/exams/results"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "userId": "{{studentUserId}}",
      "subjectName": "Mathematics",
      "examTitle": "FA-2 Mathematics",
      "marksObtained": 17,
      "marksMax": 20,
      "grade": "A2"
    }
order: 12300
