$kind: http-request
name: POST /api/admin/chapters
description: Create chapter
url: "{{baseUrl}}/api/admin/chapters"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id": "c8-demo-ch1",
      "subjectId": "c8-maths",
      "title": "Demo Chapter",
      "order": 99
    }
order: 4300
